<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 320px; padding: 14px; background: #0d1117; color: #c9d1d9; margin: 0; }
    h3 { margin: 0 0 12px 0; font-size: 15px; color: #58a6ff; text-align: center; }
    .section-title { font-size: 11px; font-weight: bold; color: #7ee787; margin-top: 12px; text-transform: uppercase; border-bottom: 1px solid #30363d; padding-bottom: 3px; }
    label { font-size: 11px; color: #8b949e; display: block; margin-top: 8px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; background: #161b22; border: 1px solid #30363d; color: #f0f6fc; border-radius: 6px; margin-top: 3px; font-size: 12px; outline: none; }
    input:focus { border-color: #58a6ff; }
    button { width: 100%; padding: 8px; margin-top: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: background 0.2s; }
    #saveBtn { background: #238636; color: white; margin-top: 14px; }
    #saveBtn:hover { background: #2ea043; }
    .portal-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .portal-btn { background: #21262d; border: 1px solid #30363d; color: #58a6ff; flex: 1 1 30%; padding: 8px; }
    .portal-btn:hover { background: #30363d; }
  </style>
</head>
<body>
  <h3>Auto Job Search & Applier</h3>

  <div class="section-title">Search Target</div>
  <label>Target Job Title</label>
  <input type="text" id="jobTitle" value="IT Manager">
  
  <label>Target City</label>
  <input type="text" id="city" value="Mumbai">

  <div class="section-title">Application Profile</div>
  <label>Full Name</label>
  <input type="text" id="fullName" placeholder="John Doe">

  <label>Email Address</label>
  <input type="text" id="email" placeholder="john.doe@example.com">

  <label>Total Experience (Years)</label>
  <input type="text" id="exp" value="5">

  <label>Current CTC (₹)</label>
  <input type="text" id="currentCtc" value="1650000">

  <label>Expected CTC (₹)</label>
  <input type="text" id="expectedCtc" value="1800000">

  <label>Notice Period</label>
  <input type="text" id="notice" value="30 Days">

  <label>Phone Number</label>
  <input type="text" id="phone" value="+919876543210">

  <button id="saveBtn">Save Profile Settings</button>

  <div class="section-title">Launch Search & Auto-Apply</div>
  <div class="portal-container">
    <button class="portal-btn" id="openNaukri">Naukri</button>
    <button class="portal-btn" id="openLinkedIn">LinkedIn</button>
    <button class="portal-btn" id="openShine">Shine</button>
    <button class="portal-btn" id="openIndeed">Indeed</button>
    <button class="portal-btn" id="openMichaelPage">Michael Page</button>
  </div>

  <script src="popup.js"></script>
<p style="text-align:center; font-size:11px; color:grey;">
Developed by Chandresh Suvarna
</p>
</body>
</html>
